openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for Sistema de Panificación
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: proveedores
    description: Supplier management
  - name: productos
    description: Product catalog
  - name: ventas
    description: Sales operations
  - name: compras
    description: Purchase operations
  - name: combos
    description: Product combo management
  - name: camionetas
    description: Delivery vehicle management
  - name: reportes
    description: Reports and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /proveedores:
    get:
      operationId: listarProveedores
      tags: [proveedores]
      summary: List all suppliers
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proveedor"
    post:
      operationId: crearProveedor
      tags: [proveedores]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearProveedorBody"
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"

  /proveedores/{id}:
    get:
      operationId: obtenerProveedor
      tags: [proveedores]
      summary: Get supplier by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: actualizarProveedor
      tags: [proveedores]
      summary: Update a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearProveedorBody"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proveedor"
    delete:
      operationId: eliminarProveedor
      tags: [proveedores]
      summary: Delete a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeResponse"

  /proveedores/{id}/productos:
    get:
      operationId: obtenerProductosPorProveedor
      tags: [proveedores]
      summary: Get all products supplied by a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Products from supplier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"

  /proveedores/{id}/compras:
    get:
      operationId: obtenerComprasPorProveedor
      tags: [proveedores]
      summary: Get all purchases from a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Purchases from supplier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compra"

  /proveedores/{id}/resumen:
    get:
      operationId: obtenerResumenProveedor
      tags: [proveedores]
      summary: Get financial summary per supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenProveedor"

  /productos:
    get:
      operationId: listarProductos
      tags: [productos]
      summary: List all products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"
    post:
      operationId: crearProducto
      tags: [productos]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearProductoBody"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"

  /productos/{codigo}:
    get:
      operationId: obtenerProducto
      tags: [productos]
      summary: Get product by code
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: actualizarProducto
      tags: [productos]
      summary: Update a product
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarProductoBody"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
    delete:
      operationId: eliminarProducto
      tags: [productos]
      summary: Delete a product
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeResponse"

  /ventas:
    get:
      operationId: listarVentas
      tags: [ventas]
      summary: List all sales
      parameters:
        - name: fechaDesde
          in: query
          required: false
          schema:
            type: string
        - name: fechaHasta
          in: query
          required: false
          schema:
            type: string
        - name: vendedor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Venta"
    post:
      operationId: registrarVenta
      tags: [ventas]
      summary: Register a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarVentaBody"
      responses:
        "201":
          description: Sale registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venta"

  /ventas/dia/{fecha}:
    get:
      operationId: listarVentasPorDia
      tags: [ventas]
      summary: Get all sales for a specific day (YYYY-MM-DD)
      parameters:
        - name: fecha
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sales for day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenDia"
    delete:
      operationId: eliminarVentasDia
      tags: [ventas]
      summary: Delete all sales for a specific day
      parameters:
        - name: fecha
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeResponse"

  /ventas/dias:
    get:
      operationId: listarDiasConVentas
      tags: [ventas]
      summary: List all days that have sales, with daily totals
      responses:
        "200":
          description: Days with sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResumenDia"

  /ventas/{id}:
    get:
      operationId: obtenerVenta
      tags: [ventas]
      summary: Get sale by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sale found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venta"
    delete:
      operationId: eliminarVenta
      tags: [ventas]
      summary: Delete a single sale by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeResponse"

  /compras:
    get:
      operationId: listarCompras
      tags: [compras]
      summary: List all purchases
      parameters:
        - name: fechaDesde
          in: query
          required: false
          schema:
            type: string
        - name: fechaHasta
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compra"
    post:
      operationId: registrarCompra
      tags: [compras]
      summary: Register a purchase (stock replenishment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarCompraBody"
      responses:
        "201":
          description: Purchase registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compra"

  /combos:
    get:
      operationId: listarCombos
      tags: [combos]
      summary: List all product combos
      responses:
        "200":
          description: List of combos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Combo"
    post:
      operationId: crearCombo
      tags: [combos]
      summary: Create a product combo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComboInput"
      responses:
        "201":
          description: Created combo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combo"

  /combos/{id}:
    delete:
      operationId: eliminarCombo
      tags: [combos]
      summary: Delete a product combo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted combo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeResponse"
        "404":
          description: Combo not found

  /camioneta/camionetas:
    get:
      operationId: listarCamionetas
      tags: [camionetas]
      summary: List active delivery vehicles
      responses:
        "200":
          description: List of delivery vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Camioneta"
    post:
      operationId: crearCamioneta
      tags: [camionetas]
      summary: Create a delivery vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CamionetaInput"
      responses:
        "201":
          description: Created delivery vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camioneta"
        "403":
          description: Administrator access required
  /camioneta/camionetas/{codigo}:
    delete:
      operationId: eliminarCamioneta
      tags: [camionetas]
      summary: Delete an empty delivery vehicle
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted delivery vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MensajeResponse"
        "403":
          description: Administrator access required
        "409":
          description: Vehicle still has stock

  /reportes/resumen:
    get:
      operationId: obtenerResumen
      tags: [reportes]
      summary: Get financial summary (investment, revenue, profit)
      parameters:
        - name: fechaDesde
          in: query
          required: false
          schema:
            type: string
        - name: fechaHasta
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenFinanciero"

  /reportes/top-productos:
    get:
      operationId: obtenerTopProductos
      tags: [reportes]
      summary: Get top selling products
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProducto"

  /reportes/ventas-por-dia:
    get:
      operationId: obtenerVentasPorDia
      tags: [reportes]
      summary: Get sales grouped by day
      parameters:
        - name: dias
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Sales by day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VentaPorDia"

  /reportes/vendedores:
    get:
      operationId: obtenerReporteVendedores
      tags: [reportes]
      summary: Get sales performance by seller
      responses:
        "200":
          description: Sellers report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReporteVendedor"

  /reportes/stock-bajo:
    get:
      operationId: obtenerStockBajo
      tags: [reportes]
      summary: Get products with low stock
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producto"

components:
  schemas:
    Proveedor:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        contacto:
          type: string
        telefono:
          type: string
        email:
          type: string
        direccion:
          type: string
        notas:
          type: string
        creadoEn:
          type: string
        actualizadoEn:
          type: string
      required: [id, nombre, creadoEn, actualizadoEn]

    CrearProveedorBody:
      type: object
      properties:
        nombre:
          type: string
        contacto:
          type: string
        telefono:
          type: string
        email:
          type: string
        direccion:
          type: string
        notas:
          type: string
      required: [nombre]

    ResumenProveedor:
      type: object
      properties:
        proveedorId:
          type: integer
        proveedorNombre:
          type: string
        totalCompras:
          type: integer
        totalInvertido:
          type: number
        totalProductos:
          type: integer
        ultimaCompra:
          type: string
      required: [proveedorId, proveedorNombre, totalCompras, totalInvertido, totalProductos]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MensajeResponse:
      type: object
      properties:
        mensaje:
          type: string
      required: [mensaje]

    Producto:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        precioVenta:
          type: number
        precioCosto:
          type: number
        stock:
          type: integer
        stockMinimo:
          type: integer
        unidad:
          type: string
        proveedorId:
          type: integer
        proveedorNombre:
          type: string
        creadoEn:
          type: string
        actualizadoEn:
          type: string
      required: [id, codigo, nombre, descripcion, precioVenta, precioCosto, stock, stockMinimo, unidad, creadoEn, actualizadoEn]

    CrearProductoBody:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        precioVenta:
          type: number
        precioCosto:
          type: number
        stock:
          type: integer
        stockMinimo:
          type: integer
        unidad:
          type: string
        proveedorId:
          type: integer
      required: [codigo, nombre, descripcion, precioVenta, precioCosto, stock, stockMinimo, unidad]

    ActualizarProductoBody:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precioVenta:
          type: number
        precioCosto:
          type: number
        stock:
          type: integer
        stockMinimo:
          type: integer
        unidad:
          type: string
        proveedorId:
          type: integer

    ResumenDia:
      type: object
      properties:
        fecha:
          type: string
        totalVentas:
          type: number
        totalGanancia:
          type: number
        cantidadVentas:
          type: integer
        ventas:
          type: array
          items:
            $ref: "#/components/schemas/Venta"
      required: [fecha, totalVentas, totalGanancia, cantidadVentas, ventas]

    Venta:
      type: object
      properties:
        id:
          type: integer
        vendedor:
          type: string
        fecha:
          type: string
        total:
          type: number
        ganancia:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemVenta"
      required: [id, vendedor, fecha, total, ganancia, items]

    ItemVenta:
      type: object
      properties:
        id:
          type: integer
        ventaId:
          type: integer
        productoCodigo:
          type: string
        productoNombre:
          type: string
        cantidad:
          type: integer
        precioUnitario:
          type: number
        precioCosto:
          type: number
        subtotal:
          type: number
      required: [id, ventaId, productoCodigo, productoNombre, cantidad, precioUnitario, precioCosto, subtotal]

    RegistrarVentaBody:
      type: object
      properties:
        vendedor:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemVentaInput"
      required: [vendedor, items]

    ItemVentaInput:
      type: object
      properties:
        productoCodigo:
          type: string
        cantidad:
          type: integer
      required: [productoCodigo, cantidad]

    Compra:
      type: object
      properties:
        id:
          type: integer
        proveedor:
          type: string
        fecha:
          type: string
        totalInvertido:
          type: number
        notas:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemCompra"
      required: [id, proveedor, fecha, totalInvertido, items]

    ItemCompra:
      type: object
      properties:
        id:
          type: integer
        compraId:
          type: integer
        productoCodigo:
          type: string
        productoNombre:
          type: string
        cantidad:
          type: integer
        precioCosto:
          type: number
        subtotal:
          type: number
      required: [id, compraId, productoCodigo, productoNombre, cantidad, precioCosto, subtotal]

    RegistrarCompraBody:
      type: object
      properties:
        proveedor:
          type: string
        notas:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemCompraInput"
      required: [proveedor, items]

    Combo:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
        precioVenta:
          type: number
        activo:
          type: boolean
        creadoEn:
          type: string
        actualizadoEn:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ComboItem"
      required: [id, nombre, descripcion, precioVenta, activo, creadoEn, actualizadoEn, items]

    ComboItem:
      type: object
      properties:
        productoCodigo:
          type: string
        productoNombre:
          type: string
        cantidad:
          type: integer
        precioUnitario:
          type: number
      required: [productoCodigo, productoNombre, cantidad, precioUnitario]

    ComboInput:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
        descripcion:
          type: string
        precioVenta:
          type: number
          minimum: 0
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ComboItemInput"
      required: [nombre, precioVenta, items]

    ComboItemInput:
      type: object
      properties:
        productoCodigo:
          type: string
          minLength: 1
        cantidad:
          type: integer
          minimum: 1
      required: [productoCodigo, cantidad]

    Camioneta:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        nombre:
          type: string
        activo:
          type: boolean
        stockTotal:
          type: integer
        creadoEn:
          type: string
      required: [id, codigo, nombre, activo, stockTotal, creadoEn]

    CamionetaInput:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
      required: [nombre]

    ItemCompraInput:
      type: object
      properties:
        productoCodigo:
          type: string
        cantidad:
          type: integer
        precioCosto:
          type: number
      required: [productoCodigo, cantidad, precioCosto]

    ResumenFinanciero:
      type: object
      properties:
        totalVentas:
          type: number
        totalInvertido:
          type: number
        gananciaTotal:
          type: number
        cantidadVentas:
          type: integer
        cantidadCompras:
          type: integer
        margenPromedio:
          type: number
      required: [totalVentas, totalInvertido, gananciaTotal, cantidadVentas, cantidadCompras, margenPromedio]

    TopProducto:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        cantidadVendida:
          type: integer
        ingresos:
          type: number
        ganancia:
          type: number
      required: [codigo, nombre, cantidadVendida, ingresos, ganancia]

    VentaPorDia:
      type: object
      properties:
        fecha:
          type: string
        totalVentas:
          type: number
        cantidadVentas:
          type: integer
        ganancia:
          type: number
      required: [fecha, totalVentas, cantidadVentas, ganancia]

    ReporteVendedor:
      type: object
      properties:
        vendedor:
          type: string
        cantidadVentas:
          type: integer
        totalVentas:
          type: number
        gananciaGenerada:
          type: number
      required: [vendedor, cantidadVentas, totalVentas, gananciaGenerada]
